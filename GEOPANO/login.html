<body>
<header>
  <nav class="container">
    <h1>🍸 BOXYARD Resto Bar</h1>

</header>
<main>
<section class="login">
  <div class="container">
    <h2 class="section-title">Member Login</h2>
    <form id="loginForm" class="auth-form">
      <input type="text" name="username" placeholder="Username" required aria-label="Username">
      <input type="password" name="password" placeholder="Password" required aria-label="Password">
      <label><input type="checkbox" id="remember"> Remember me</label>
      <button type="submit">Sign In</button>
      <div class="row"><a href="#" class="forgot">Forgot Password?</a><span class="signup">No account? <a href="#">Sign up</a></span></div>
    </form>
    <div class="sample-box">
      <h3>Sample Accounts — click to auto-fill</h3>
      <div id="sampleList"></div>
      <p class="sample-hint">Each account redirects to its role dashboard.</p>
    </div>
  </div>
</section>
</main>
<footer>
  <div class="container">
