<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOXYARD Resto Bar - Reservations</title>
    <meta name="description" content="Book your table at BOXYARD Resto Bar. Fine dining reservations.">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="container">
            <h1>🍸 BOXYARD Resto Bar</h1>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="reservations.html">Reservations</a></li>
                <li><a href="login.html" class="login-link">Login</a></li>
            </ul>
        </nav>
    </header>
    
    <section class="reservations">
        <div class="container">
            <h2>Book Your Table</h2>
            <form id="reservationForm">
                <input type="text" placeholder="Full Name" required aria-label="Full Name">
                <input type="email" placeholder="Email" required aria-label="Email">
                <input type="tel" placeholder="Phone" required aria-label="Phone">
                <input type="date" required aria-label="Date">
                <select required aria-label="Party Size">
                    <option value="">Party Size</option>
                    <option value="2">2 people</option>
                    <option value="4">4 people</option>
                    <option value="6">6 people</option>
                    <option value="8+">8+ people</option>
                </select>
                <textarea rows="4" placeholder="Special Requests" aria-label="Special Requests"></textarea>
                <button type="submit">Make Reservation</button>
            </form>
        </div>
    </section>
    
    <footer>
        <div class="container">
&copy; 2026 BOXYARD Resto Bar. All rights reserved. | 21+ Only
            <div class="social-links">
                <a href="#" aria-label="Instagram">📸</a>
                <a href="#" aria-label="Facebook">📘</a>
                <a href="#" aria-label="Twitter">🐦</a>
            </div>
        </div>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
